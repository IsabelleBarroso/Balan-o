<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#12322A">
<title>Minhas finanças</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanças">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --tinta:#12322A; --tinta2:#1D4A3E;
  --papel:#F2EEE4; --carta:#FFFFFF;
  --rosa:#B4566A; --ouro:#BE8724; --cinza:#6E7C74; --verde:#2E7D52; --tijolo:#9B5C2E;
  --linha:rgba(18,50,42,.13);
  --display:'Fraunces',Georgia,serif;
  --texto:'Inter',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overscroll-behavior-y:none}
body{background:var(--tinta);font-family:var(--texto);color:var(--tinta);font-size:15px;line-height:1.45}
#shell{max-width:470px;margin:0 auto;min-height:100vh;background:var(--papel);box-shadow:0 0 60px rgba(0,0,0,.35);padding-bottom:92px;position:relative}
header{background:var(--tinta);color:var(--papel);padding:calc(18px + env(safe-area-inset-top)) 20px 20px}
.cab-topo{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.eyebrow{font-size:10.5px;letter-spacing:.19em;text-transform:uppercase;color:rgba(242,238,228,.6);margin:0 0 6px;font-weight:500;display:flex;align-items:center;gap:8px}
.eyebrow .ver{letter-spacing:.04em;text-transform:none;font-size:10px;color:rgba(242,238,228,.42);padding-left:8px;border-left:1px solid rgba(242,238,228,.2)}
.selo{width:8px;height:8px;border-radius:99px;background:rgba(242,238,228,.3);display:inline-block;flex:none}
.selo.on{background:#5FD08A}
.selo.con{background:#E8B34A;animation:pisca 1.1s ease-in-out infinite}
.selo.off{background:#E8899C}
@keyframes pisca{0%,100%{opacity:1}50%{opacity:.25}}
.sinc{font-size:11.5px;color:var(--cinza);display:flex;align-items:center;gap:6px;margin:10px 0 14px}
.sinc em{width:7px;height:7px;border-radius:99px;background:var(--cinza);display:inline-block;flex:none;font-style:normal}
.sinc em.on{background:#2E9E5B}.sinc em.con{background:var(--ouro)}.sinc em.off{background:var(--rosa)}
header h1{font-family:var(--display);font-weight:500;font-size:26px;margin:0;letter-spacing:-.01em}
.ajustes-btn{background:rgba(242,238,228,.12);border:0;color:var(--papel);width:34px;height:34px;border-radius:99px;font-size:16px;cursor:pointer;flex:none}
.headline{margin-top:13px;border-top:1px solid rgba(242,238,228,.18);padding-top:12px;display:flex;align-items:baseline;gap:9px}
.headline b{font-family:var(--display);font-size:30px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.headline span{font-size:12px;color:rgba(242,238,228,.7)}
main{padding:16px 16px 8px}
.secao-titulo{font-size:10.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--cinza);font-weight:600;margin:22px 2px 9px}
.secao-titulo:first-child{margin-top:2px}
.cartao{background:var(--carta);border:1px solid var(--linha);border-radius:14px;padding:15px;margin-bottom:11px}
.topo{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px;gap:10px}
.rot{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--cinza);font-weight:600}
.val{font-family:var(--display);font-size:26px;font-weight:500;letter-spacing:-.02em;display:block;margin-top:2px;font-variant-numeric:tabular-nums}
.barra{height:11px;border-radius:99px;background:rgba(18,50,42,.09);display:flex;overflow:hidden}
.barra i{display:block;height:100%}
.legenda{display:flex;gap:15px;margin-top:11px;flex-wrap:wrap}
.legenda div{font-size:11.5px;color:var(--cinza);display:flex;align-items:center;gap:6px}
.legenda em{width:8px;height:8px;border-radius:99px;display:inline-block;font-style:normal}
.legenda b{color:var(--tinta);font-weight:600;font-variant-numeric:tabular-nums}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.mini{background:var(--carta);border:1px solid var(--linha);border-radius:14px;padding:13px 14px}
.mini .num{font-family:var(--display);font-size:22px;font-weight:500;margin-top:4px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.mini .pe{font-size:11.5px;color:var(--cinza);margin-top:1px}
.linha-item{background:var(--carta);border:1px solid var(--linha);border-radius:12px;padding:12px 13px;margin-bottom:8px;display:flex;gap:11px;align-items:center}
.linha-item .corpo{flex:1;min-width:0}
.linha-item .nome{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linha-item .sub{font-size:12px;color:var(--cinza);margin-top:2px}
.linha-item .valor{font-family:var(--display);font-size:16px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.linha-item .valor.ent{color:var(--verde)}
.linha-item.fx{border-left:3px solid var(--ouro)}
.linha-item.pc{border-left:3px solid var(--rosa)}
.linha-item.dv{border-left:3px solid var(--tijolo)}
.tag{display:inline-block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;padding:3px 7px;border-radius:6px;background:rgba(18,50,42,.07);color:var(--cinza)}
.tag.rec{background:rgba(46,125,82,.13);color:var(--verde)}
.tag.fixa{background:rgba(190,135,36,.16);color:#8A6212}
.tag.parc{background:rgba(180,86,106,.13);color:var(--rosa)}
.tag.div{background:rgba(155,92,46,.15);color:var(--tijolo)}
.tag.ant{background:rgba(18,50,42,.09);color:var(--tinta2)}
.tag.ok{background:rgba(46,125,82,.14);color:var(--verde)}
.x{border:0;background:transparent;color:var(--cinza);font-size:20px;line-height:1;padding:4px 6px;border-radius:8px;cursor:pointer;flex:none}
.lapis{border:0;background:transparent;color:var(--cinza);font-size:15px;padding:4px 6px;border-radius:8px;cursor:pointer;flex:none}
.saldo{background:var(--carta);border:1px solid var(--linha);border-radius:14px;padding:16px;margin-bottom:11px}
.barra2{display:flex;height:10px;border-radius:99px;overflow:hidden;background:rgba(18,50,42,.08);margin:14px 0 12px}
.barra2 i{display:block;height:100%}
.fluxo{display:flex;gap:12px}
.fluxo>div{flex:1}
.fluxo .rt{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--cinza);font-weight:600;display:flex;align-items:center;gap:5px}
.fluxo .vl{font-family:var(--display);font-size:19px;font-variant-numeric:tabular-nums;margin-top:3px}
.pt{width:8px;height:8px;border-radius:99px;display:inline-block;flex:none}
.reparte{display:flex;border-top:1px solid var(--linha);margin-top:12px;padding-top:12px}
.reparte>div{flex:1;text-align:center;border-left:1px solid var(--linha)}
.reparte>div:first-child{border-left:0}
.reparte button{flex:1;text-align:center;border:0;border-left:1px solid var(--linha);background:transparent;font-family:var(--texto);cursor:pointer;padding:4px 3px;color:var(--tinta);position:relative}
.reparte button:first-child{border-left:0}
.reparte button:hover{background:rgba(18,50,42,.04)}
.reparte button[aria-pressed="true"]{background:rgba(18,50,42,.07);border-radius:9px}
.reparte button[aria-pressed="true"] .rr{color:var(--tinta)}
.reparte button .seta{display:block;font-size:9px;color:var(--cinza);margin-top:2px;line-height:1}
.voltar{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--linha);background:transparent;color:var(--cinza);padding:7px 14px;border-radius:99px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--texto);margin-bottom:12px}
.reparte .rr{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--cinza);font-weight:600}
.reparte .vv{font-family:var(--display);font-size:15px;margin-top:3px;font-variant-numeric:tabular-nums}
/* fatura */
.fatura{background:var(--carta);border:1px solid var(--linha);border-left:3px solid var(--rosa);border-radius:14px;padding:16px;margin-bottom:11px}
.fatura .fgrande{font-family:var(--display);font-size:30px;font-weight:500;letter-spacing:-.025em;line-height:1;display:block;margin-top:3px;font-variant-numeric:tabular-nums}
.fatura .ciclo{display:flex;align-items:center;gap:8px;margin:14px 0 8px}
.fatura .trilhoc{flex:1;height:9px;border-radius:99px;background:rgba(18,50,42,.09);overflow:hidden;position:relative}
.fatura .trilhoc i{display:block;height:100%;background:var(--rosa);border-radius:99px}
.fatura .dts{font-size:10.5px;color:var(--cinza);white-space:nowrap;font-variant-numeric:tabular-nums}
.fatura .frod{display:flex;justify-content:space-between;font-size:11.5px;color:var(--cinza);margin-top:6px}
.fatura .frod b{color:var(--tinta);font-weight:600;font-variant-numeric:tabular-nums}
.fatura.clicavel{cursor:pointer}
.fatura.clicavel:hover{border-color:rgba(180,86,106,.45)}
.teto{background:var(--carta);border:1px solid var(--linha);border-radius:14px;padding:16px;margin-bottom:11px;position:relative;overflow:hidden}
.teto.estourou{border-color:rgba(180,86,106,.45)}
.teto .cabeca{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.teto .grande{font-family:var(--display);font-size:34px;font-weight:500;letter-spacing:-.025em;line-height:1;display:block;margin-top:3px;font-variant-numeric:tabular-nums}
.teto .trilho{height:13px;border-radius:99px;background:rgba(18,50,42,.09);margin:15px 0 10px;overflow:hidden;position:relative}
.teto .trilho i{display:block;height:100%;border-radius:99px;transition:width .4s ease}
.teto .marca-hoje{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--tinta);opacity:.5;border-radius:2px}
.teto .pes{display:flex;justify-content:space-between;font-size:11.5px;color:var(--cinza)}
.teto .pes b{color:var(--tinta);font-variant-numeric:tabular-nums;font-weight:600}
.ritmo{display:flex;gap:10px;margin-top:13px;border-top:1px solid var(--linha);padding-top:12px}
.ritmo>div{flex:1;text-align:center;border-left:1px solid var(--linha)}
.ritmo>div:first-child{border-left:0}
.ritmo .rr{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--cinza);font-weight:600}
.ritmo .vv{font-family:var(--display);font-size:17px;margin-top:3px;font-variant-numeric:tabular-nums}
.catteto{background:var(--carta);border:1px solid var(--linha);border-radius:12px;padding:12px 13px;margin-bottom:8px}
.catteto .l{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13.5px;margin-bottom:7px}
.catteto .l b{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.catteto .l .sobra{font-size:11px;color:var(--cinza);font-weight:400;margin-left:5px}
.catteto .t{height:8px;border-radius:99px;background:rgba(18,50,42,.08);overflow:hidden}
.catteto .t i{display:block;height:100%;border-radius:99px}
.catteto .def{display:flex;align-items:center;gap:8px;margin-top:9px}
.catteto .def input{flex:1;padding:7px 10px;font-size:14px}
.dvcard{background:var(--carta);border:1px solid var(--linha);border-left:3px solid var(--tijolo);border-radius:14px;padding:15px;margin-bottom:10px}
.dvcard .dnome{font-family:var(--display);font-size:17px;font-weight:500}
.dvcard .dsub{font-size:11.5px;color:var(--cinza);margin-top:2px}
.dvcard .dfalta{font-family:var(--display);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.dvcard .t{height:9px;border-radius:99px;background:rgba(18,50,42,.08);overflow:hidden;margin:12px 0 8px;display:flex}
.dvcard .t i{display:block;height:100%}
.dvcard .rodape{display:flex;justify-content:space-between;font-size:11.5px;color:var(--cinza)}
.dvcard .rodape b{color:var(--tinta);font-weight:600;font-variant-numeric:tabular-nums}
.dvcard.futura{border-left-color:var(--cinza)}
.pill{display:inline-block;font-size:10px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;padding:3px 8px;border-radius:99px;background:rgba(155,92,46,.13);color:var(--tijolo)}
.pill.aviso{background:rgba(180,86,106,.14);color:var(--rosa)}
.pote{background:var(--carta);border:1px solid var(--linha);border-radius:14px;padding:15px;margin-bottom:11px;border-left:3px solid var(--ouro)}
.pote .pt-topo{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pote .pnome{font-family:var(--display);font-size:18px;font-weight:500}
.pote .psaldo{font-family:var(--display);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pote .t{height:9px;border-radius:99px;background:rgba(18,50,42,.08);overflow:hidden;margin:12px 0 7px}
.pote .t i{display:block;height:100%;border-radius:99px;background:var(--ouro);transition:width .4s}
.pote .pmeta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--cinza)}
.pote .pmeta b{color:var(--tinta);font-weight:600;font-variant-numeric:tabular-nums}
.pote .pacoes{display:flex;gap:8px;margin-top:12px;border-top:1px solid var(--linha);padding-top:12px}
.mini-btn{flex:1;border:1px solid var(--linha);background:transparent;color:var(--tinta);padding:8px;border-radius:9px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--texto)}
.mini-btn.ouro{background:var(--ouro);border-color:var(--ouro);color:#fff}
.mini-btn.fantasma{color:var(--cinza)}
.aporte-tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--cinza);margin-top:9px}
.marca{width:19px;height:19px;border-radius:99px;border:1.5px solid var(--linha);flex:none;cursor:pointer;background:transparent;padding:0}
.marca.on{border-color:var(--ouro);background:var(--ouro);box-shadow:inset 0 0 0 3px var(--carta)}
span.marca{display:inline-block;box-sizing:border-box}
.marca.on.rosa{border-color:var(--rosa);background:var(--rosa)}
.passo{display:flex;align-items:center;gap:10px;border-top:1px solid var(--linha);margin-top:12px;padding-top:11px}
.passo button{width:34px;height:34px;flex:none;border:1px solid var(--linha);background:transparent;border-radius:99px;font-size:18px;line-height:1;color:var(--tinta);cursor:pointer;font-family:var(--texto)}
.passo button:disabled{opacity:.3;cursor:default}
.passo button.mais{background:var(--verde);border-color:var(--verde);color:#fff}
.passo .txt{flex:1;text-align:center;font-size:12.5px;color:var(--cinza)}
.passo .txt b{color:var(--tinta);font-weight:600;font-variant-numeric:tabular-nums;display:block;font-size:14px}
.form{background:var(--carta);border:1px dashed rgba(18,50,42,.25);border-radius:14px;padding:14px;margin-bottom:14px}
.form.edicao{border:1px solid var(--tinta2);border-left:3px solid var(--tinta2);border-style:solid}
.form.entrada{border-color:rgba(46,125,82,.4)}
.form.pote-novo{border-color:rgba(190,135,36,.5)}
.edit-tit{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta2);font-weight:600;margin-bottom:12px}
label{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--cinza);font-weight:600;margin:0 0 5px}
input,select{width:100%;padding:10px 11px;border:1px solid var(--linha);border-radius:10px;font-family:var(--texto);font-size:16px;color:var(--tinta);background:var(--papel)}
input:focus,select:focus{outline:2px solid var(--tinta2);outline-offset:1px}
.campo{margin-bottom:10px}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;padding:13px;border:0;border-radius:10px;background:var(--tinta);color:var(--papel);font-family:var(--texto);font-size:14px;font-weight:600;cursor:pointer}
.btn.claro{background:transparent;color:var(--tinta);border:1px solid var(--linha)}
.btn.verde{background:var(--verde);color:#fff}
.btn.ouro{background:var(--ouro);color:#fff}
.btn.tijolo{background:var(--tijolo);color:#fff}
.chips{display:flex;gap:7px;margin-bottom:13px;flex-wrap:wrap}
.chip{border:1px solid var(--linha);background:transparent;color:var(--cinza);padding:7px 13px;border-radius:99px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--texto)}
.chip[aria-pressed="true"]{background:var(--tinta);color:var(--papel);border-color:var(--tinta)}
.chip.tj[aria-pressed="true"]{background:var(--tijolo);border-color:var(--tijolo)}
.navmes{display:flex;align-items:center;justify-content:space-between;background:var(--carta);border:1px solid var(--linha);border-radius:12px;padding:8px 10px;margin-bottom:12px}
.navmes button{border:0;background:transparent;font-size:19px;color:var(--tinta);cursor:pointer;padding:3px 12px;border-radius:8px;line-height:1}
.navmes .cen{text-align:center;line-height:1.25}
.navmes .cen b{font-weight:600;font-size:14px;display:block}
.navmes .cen span{font-size:10.5px;color:var(--cinza);font-variant-numeric:tabular-nums}
.vazio{text-align:center;color:var(--cinza);font-size:13.5px;padding:26px 14px;border:1px dashed var(--linha);border-radius:14px;margin-bottom:11px}
.hbar{margin-bottom:11px}
.hbar .l{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}
.hbar .l b{font-variant-numeric:tabular-nums;font-weight:600}
.hbar .t{height:8px;border-radius:99px;background:rgba(18,50,42,.08);overflow:hidden}
.hbar .t i{display:block;height:100%;border-radius:99px}
.catbox{border-top:1px solid var(--linha)}
.catbox:first-child{border-top:0}
.catbox>summary{list-style:none;cursor:pointer;padding:11px 0}
.catbox>summary::-webkit-details-marker{display:none}
.catlin{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px;align-items:baseline;gap:8px}
.catlin .nm{display:flex;align-items:center;gap:7px;min-width:0}
.catlin .sta{color:var(--cinza);font-size:11px;transition:transform .18s;flex:none}
.catbox[open] .sta{transform:rotate(90deg)}
.catlin b{font-variant-numeric:tabular-nums;white-space:nowrap}
.catlin .pc{font-size:11px;color:var(--cinza);font-weight:400;margin-left:4px}
.mensal{padding:4px 0 12px 16px}
.mlin{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--cinza);margin-bottom:5px}
.mlin .mn{width:26px;flex:none}
.mlin .mt{flex:1;height:6px;background:rgba(18,50,42,.07);border-radius:99px;overflow:hidden}
.mlin .mt i{display:block;height:100%;background:var(--ouro);border-radius:99px}
.mlin .mv{width:78px;text-align:right;font-variant-numeric:tabular-nums;flex:none}
.cats-chips{display:flex;flex-wrap:wrap;gap:7px}
.cat-chip{display:inline-flex;align-items:center;gap:3px;background:var(--papel);border:1px solid var(--linha);border-radius:99px;padding:6px 6px 6px 13px;font-size:13px;font-weight:500}
.cat-chip button{border:0;background:transparent;color:var(--cinza);font-size:16px;line-height:1;cursor:pointer;padding:2px 5px;border-radius:99px;font-family:var(--texto)}
nav{position:fixed;bottom:0;left:0;right:0;max-width:470px;margin:0 auto;background:var(--carta);border-top:1px solid var(--linha);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav button{flex:1;border:0;background:transparent;padding:13px 1px 15px;cursor:pointer;font-family:var(--texto);font-size:10.5px;font-weight:600;color:var(--cinza);position:relative}
nav button[aria-current="true"]{color:var(--tinta)}
nav button[aria-current="true"]::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:24px;height:2px;background:var(--tinta);border-radius:0 0 3px 3px}
nav button.gan[aria-current="true"]{color:var(--verde)}
nav button.gan[aria-current="true"]::before{background:var(--verde)}
nav button.pou[aria-current="true"]{color:#8A6212}
nav button.pou[aria-current="true"]::before{background:var(--ouro)}
nav .divisor{width:1px;background:var(--linha);margin:12px 0}

/* ============ DATAS E CICLO DA FATURA ============ */
const pad=n=>String(n).padStart(2,'0');
const agora=()=>new Date();
const chaveDe=(a,m)=>a+'-'+pad(m);
const hojeISO=()=>{const d=agora();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const R$=v=>(Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const curto=v=>'R$ '+Math.round(Number(v)||0).toLocaleString('pt-BR');
const dataBR=s=>{if(!s)return'';const p=s.split('-');return p[2]+'/'+p[1];};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rotuloMes=k=>{const p=k.split('-');return MESES[+p[1]-1]+' de '+p[0];};
const nomeMes=k=>MESES[+k.split('-')[1]-1];
const rotuloCurto=k=>{const p=k.split('-');return M3[+p[1]-1]+'/'+p[0].slice(2);};
const somaMes=(k,n)=>{const p=k.split('-').map(Number);const d=new Date(p[0],p[1]-1+n,1);return chaveDe(d.getFullYear(),d.getMonth()+1);};

/* Ciclo: compras de (fechamento+1) do mês anterior até (fechamento) deste mês
   formam a fatura DESTE mês, paga no dia do vencimento do mês seguinte. */
function cicloISO(s){
  const p=s.split('-').map(Number);
  if(p[2]>D.cartao.fechamento){const d=new Date(p[0],p[1],1);return chaveDe(d.getFullYear(),d.getMonth()+1);}
  return chaveDe(p[0],p[1]);
}
const cicloData=dt=>cicloISO(dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate()));
const cicloAtual=()=>cicloData(agora());
function inicioCiclo(k){const p=k.split('-').map(Number);return new Date(p[0],p[1]-2,D.cartao.fechamento+1);}
function fimCiclo(k){const p=k.split('-').map(Number);return new Date(p[0],p[1]-1,D.cartao.fechamento);}
function vencCiclo(k){const p=k.split('-').map(Number);return new Date(p[0],p[1],D.cartao.vencimento);}
const dBR=dt=>pad(dt.getDate())+'/'+pad(dt.getMonth()+1);
const faixaCiclo=k=>dBR(inicioCiclo(k))+' a '+dBR(fimCiclo(k));
const diasCiclo=k=>Math.round((fimCiclo(k)-inicioCiclo(k))/86400000)+1;
function diaNoCiclo(k){
  const h=agora();h.setHours(0,0,0,0);
  const i=inicioCiclo(k);
  return Math.min(Math.max(Math.round((h-i)/86400000)+1,0),diasCiclo(k));
}

/* data real de uma conta fixa dentro do ciclo k */
function dataFixaISO(f,k){
  const p=k.split('-').map(Number);
  let a=p[0],m=p[1];
  if(f.dia>D.cartao.fechamento){const d=new Date(p[0],p[1]-2,1);a=d.getFullYear();m=d.getMonth()+1;}
  const ult=new Date(a,m,0).getDate();
  return chaveDe(a,m)+'-'+pad(Math.min(f.dia,ult));
}
function dataDividaISO(d,mesCal){
  const p=mesCal.split('-').map(Number);
  const ult=new Date(p[0],p[1],0).getDate();
  return mesCal+'-'+pad(Math.min(d.dia,ult));
}

function parcelasDe(g){
  const out=[];const p=g.data.split('-').map(Number);const v=g.valor/g.parcelas;
  for(let i=0;i<g.parcelas;i++){
    const ult=new Date(p[0],p[1]+i,0).getDate();
    const dt=new Date(p[0],p[1]-1+i,Math.min(p[2],ult));
    out.push({chave:g.id+'-'+(i+1),desc:g.desc,n:i+1,de:g.parcelas,valor:v,dt,
      k:cicloData(dt),forma:g.forma,cat:g.cat,g,paga:i<(g.pagas||0)});
  }
  return out;
}
const todasParcelas=()=>D.gastos.filter(g=>g.parcelado).flatMap(parcelasDe).sort((a,b)=>a.dt-b.dt);
const parcelasAbertas=()=>todasParcelas().filter(x=>!x.paga);
const valorFixa=(f,k)=>(f.ajustes&&f.ajustes[k]!==undefined)?f.ajustes[k]:(f.valor||0);

function parcelasDivida(d){
  if(!d.inicio||!(d.parcela>0))return[];
  const out=[];
  for(let i=0;i<d.total;i++){
    const mesCal=somaMes(d.inicio,i);
    const iso=dataDividaISO(d,mesCal);
    out.push({chave:d.id+'-'+(i+1),n:i+1,de:d.total,valor:d.parcela,k:cicloISO(iso),iso,paga:i<d.pagas,d});
  }
  return out;
}
const faltaDivida=d=>(d.parcela>0)?(d.total-d.pagas)*d.parcela:(d.saldoAvulso||0);
const totalDivida=d=>(d.parcela>0)?d.total*d.parcela:(d.saldoAvulso||0);
const ultimaParcela=d=>(!d.inicio||!(d.parcela>0))?null:cicloISO(dataDividaISO(d,somaMes(d.inicio,d.total-1)));
const totalDevidoEmprestimos=()=>D.dividas.reduce((s,d)=>s+faltaDivida(d),0);
const totalDevidoCartao=()=>parcelasAbertas().reduce((s,x)=>s+x.valor,0);
const totalDevido=()=>totalDevidoEmprestimos()+totalDevidoCartao();

function pesoDividaMes(k){
  if(antesDoInicio(k))return 0;
  let t=0;
  D.dividas.forEach(d=>parcelasDivida(d).forEach(p=>{if(p.k===k)t+=p.valor;}));

  return t;
}
function ultimoMesComDivida(){
  let u='';
  D.dividas.forEach(d=>{const x=ultimaParcela(d);if(x&&x>u)u=x;});
  todasParcelas().forEach(p=>{if(p.k>u)u=p.k;});
  return u;
}

const antesDoInicio=k=>!!(D.inicioUso)&&k<D.inicioUso;
function itensDoMes(k){
  if(antesDoInicio(k))return [];
  const out=[];
  D.gastos.forEach(g=>{
    if(!g.parcelado){
      if(cicloISO(g.data)===k)
        out.push({tipo:'vista',g,id:g.id,valor:g.valor,forma:g.forma,cat:g.cat,desc:g.desc,data:g.data});
    } else parcelasDe(g).forEach(p=>{
      if(p.k===k)out.push({tipo:'parcela',g,id:g.id,valor:p.valor,forma:g.forma,cat:g.cat,desc:g.desc,
        data:p.dt.getFullYear()+'-'+pad(p.dt.getMonth()+1)+'-'+pad(p.dt.getDate()),n:p.n,de:p.de,chave:p.chave});
    });
  });
  (D.fixas||[]).forEach(f=>{
    if(f.ativa===false)return;
    const iso=dataFixaISO(f,k);
    out.push({tipo:'fixa',f,id:f.id,valor:valorFixa(f,k),forma:f.forma,cat:f.cat,desc:f.nome,data:iso,chave:f.id+'-'+k});
  });
  (D.dividas||[]).forEach(d=>parcelasDivida(d).forEach(p=>{
    if(p.k===k)out.push({tipo:'divida',d,id:d.id,valor:p.valor,forma:d.forma,cat:'Empréstimos',
      desc:d.nome,data:p.iso,n:p.n,de:p.de,chave:p.chave});
  }));
  return out.sort((a,b)=>(a.data||'').localeCompare(b.data||''));
}
const fluxoMes=k=>itensDoMes(k).reduce((s,i)=>s+i.valor,0);

function itensGanhoMes(k){
  if(antesDoInicio(k))return [];
  const out=[];
  (D.ganhos||[]).forEach(g=>{
    if(!g.repete){if(cicloISO(g.data)===k)out.push({g,valor:g.valor,fonte:g.fonte});}
    else{
      const p=g.data.split('-').map(Number),n=g.vezes||12;
      for(let i=0;i<n;i++){
        const ult=new Date(p[0],p[1]+i,0).getDate();
        const dt=new Date(p[0],p[1]-1+i,Math.min(p[2],ult));
        if(cicloData(dt)===k){out.push({g,valor:g.valor,fonte:g.fonte});break;}
      }
    }
  });
  return out;
}
const entradasMes=k=>antesDoInicio(k)?0:itensGanhoMes(k).reduce((s,i)=>s+i.valor,0)+(D.contribParceiro||0);
const mesesDoAno=a=>{const r=[];for(let m=1;m<=12;m++)r.push(chaveDe(a,m));return r;};
function agregaAno(a,fn,campo){
  const tot={},mensal={};
  mesesDoAno(a).forEach((k,mi)=>fn(k).forEach(i=>{
    const c=i[campo]||'Outros';
    tot[c]=(tot[c]||0)+i.valor;
    mensal[c]=mensal[c]||Array(12).fill(0);
    mensal[c][mi]+=i.valor;}));
  return{tot,mensal};
}

/* ==================== O PLANO DO MÊS ==================== */
/* Salário − empréstimos fora do cartão − poupança − sobra desejada = disponível.
   O disponível é consumido pela fatura do cartão e pelos gastos fora dele. */
const ehCartao=i=>i.forma==='credito';
const aportesMes=k=>(D.poupancas||[]).filter(p=>!p.ate||k<=p.ate).reduce((s,p)=>s+(p.aporte||0),0);
const compromissosFora=k=>itensDoMes(k).filter(i=>!ehCartao(i)&&i.tipo!=='vista').reduce((s,i)=>s+i.valor,0);
const foraCartao=k=>itensDoMes(k).filter(i=>!ehCartao(i)&&i.tipo==='vista').reduce((s,i)=>s+i.valor,0);
const assinaturasCartao=k=>itensDoMes(k).filter(i=>ehCartao(i)&&i.tipo==='fixa').reduce((s,i)=>s+i.valor,0);
const parcelasCartaoMes=k=>itensDoMes(k).filter(i=>ehCartao(i)&&i.tipo==='parcela').reduce((s,i)=>s+i.valor,0);
const comprasCartao=k=>itensDoMes(k).filter(i=>ehCartao(i)&&i.tipo==='vista').reduce((s,i)=>s+i.valor,0);
const faturaMes=k=>itensDoMes(k).filter(ehCartao).reduce((s,i)=>s+i.valor,0);
const faturaComprometida=k=>assinaturasCartao(k)+parcelasCartaoMes(k);
const rendaBase=()=>(D.renda||0)+(D.contribParceiro||0);
const dispMes=k=>antesDoInicio(k)?0:disponivel(k);
const disponivel=k=>Math.max(rendaBase()-compromissosFora(k)-aportesMes(k)-(D.sobraDesejada||0),0);
const usado=k=>faturaMes(k)+foraCartao(k);
const livre=k=>disponivel(k)-usado(k);
/* quanto ainda cabe no cartão sem furar o plano */
const cabeNoCartao=k=>Math.max(livre(k),0);
const comprometidoMes=k=>itensDoMes(k).filter(i=>i.tipo!=='vista').reduce((s,i)=>s+i.valor,0);
const variaveisMes=k=>itensDoMes(k).filter(i=>i.tipo==='vista');
const gastoVariavel=k=>variaveisMes(k).reduce((s,i)=>s+i.valor,0);
const tetoGeral=k=>disponivel(k);
function porCatVariavel(k){const o={};variaveisMes(k).forEach(i=>o[i.cat]=(o[i.cat]||0)+i.valor);return o;}
const corUso=p=>p>=1?'var(--rosa)':p>=.8?'var(--ouro)':'var(--verde)';

/* ---- CARTÃO PRINCIPAL: quanto ainda posso gastar ---- */
function cartaoPlano(k){
  const disp=disponivel(k),us=usado(k),lv=disp-us;
  const pct=disp?Math.min(us/disp,1):0,estourou=lv<0;
  const dias=diasCiclo(k),ehAtual=k===cicloAtual();
  const dh=ehAtual?diaNoCiclo(k):dias;
  const faltam=Math.max(dias-dh+1,1);
  const porDia=lv>0?lv/faltam:0;
  if(!rendaBase())return `<div class="cartao"><div class="vazio" style="margin:0;border:0;padding:14px">Defina seu salário em ⚙ Ajustes.</div></div>`;
  return `<div class="teto ${estourou?'estourou':''}">
    <div class="cabeca">
      <div><span class="rot">${estourou?'Passou do que dá' : 'Ainda posso gastar'}</span>
        <b class="grande" style="color:${estourou?'var(--rosa)':'var(--tinta)'}">${R$(Math.abs(lv))}</b></div>
      <div style="text-align:right"><span class="rot">Disponível</span>
        <b class="val" style="font-size:16px;color:var(--cinza)">${R$(disp)}</b></div>
    </div>
    <div class="trilho"><i style="width:${pct*100}%;background:${corUso(disp?us/disp:0)}"></i>
      ${ehAtual?`<span class="marca-hoje" style="left:${(dh/dias)*100}%"></span>`:''}</div>
    <div class="pes"><span>Já usou <b>${R$(us)}</b></span><span>${disp?((us/disp)*100).toFixed(0):0}% do disponível</span></div>
    <div class="ritmo">
      <div><div class="rr">Dias até fechar</div><div class="vv">${ehAtual?faltam:'—'}</div></div>
      <div><div class="rr">Por dia</div><div class="vv" style="color:${porDia?'var(--tinta)':'var(--rosa)'}">${R$(porDia)}</div></div>
      <div><div class="rr">No cartão cabe</div><div class="vv" style="color:${lv>0?'var(--rosa)':'var(--cinza)'}">${R$(Math.max(lv,0))}</div></div>
    </div></div>`;
}

/* ---- ACERTO DO MÊS ----
   O mês fecha, mas a conta só é fechada quando o salário cai e você o registra.
   Aí o app usa o valor real recebido para calcular a sobra. */
const mesFechado=k=>fimCiclo(k)<agora();
const fechamentoDe=k=>(D.fechamentos||{})[k];
const salarioRecebido=k=>{const f=fechamentoDe(k);return f&&f.salario!==undefined?f.salario:null;};
const saiuNoMes=k=>usado(k)+compromissosFora(k)+aportesMes(k);
const sobraDoMes=k=>(salarioRecebido(k)!==null?salarioRecebido(k):rendaBase())-saiuNoMes(k);
const acertoPendente=k=>!antesDoInicio(k)&&mesFechado(k)&&!(fechamentoDe(k)&&fechamentoDe(k).destino);

        <div style="text-align:right"><span class="rot">do salário</span>

    : `<div class="topo" style="margin-bottom:8px">
        <div><span class="rot">${nomeMes(k)} fechou</span>

          <span style="font-size:12px;color:var(--cinza)">a pagar com o próximo salário</span></div></div>`;

  return `<div class="cartao" style="border-left:3px solid ${recebido?(pos?'var(--verde)':'var(--rosa)'):'var(--ouro)'}">
    ${cabeca}
    <table style="width:100%;font-size:13px;border-collapse:collapse">
      ${recebido?linha('Salário recebido em '+dataBR(f.recebidoEm),sal):linha('Salário previsto',rendaBase(),'var(--cinza)')}
      ${linha('Fatura de '+nomeMes(k)+' (vence '+dBR(vencCiclo(k))+')',faturaMes(k),'var(--cinza)')}
      ${linha('Débito e Pix',foraCartao(k),'var(--cinza)')}
      ${linha('Empréstimos',compromissosFora(k),'var(--cinza)')}
      ${linha('Poupanças',aportesMes(k),'var(--cinza)')}
      <tr><td style="padding:8px 0 0;border-top:1px solid var(--linha);font-weight:600">${recebido?(pos?'Sobrou':'Faltou'):'Sobraria'}</td>
        <td style="text-align:right;padding-top:8px;border-top:1px solid var(--linha);font-family:var(--display);font-size:17px;font-variant-numeric:tabular-nums;color:${pos?'var(--tinta)':'var(--rosa)'}">${R$(Math.abs(sobra))}</td></tr>
    </table>

    ${!recebido ? `<div class="aviso" style="margin:13px 0 0">
        Assim que o salário cair, registre o valor real. A sobra é calculada em cima dele, não da previsão.</div>
      <button class="btn ouro" style="margin-top:10px" onclick="registrarSalario('${k}')">Recebi o salário</button>`
    : decidido ? `<div class="aviso" style="margin:13px 0 0">
        ${f.destino==='conta'?'Você decidiu deixar em conta.':'Você destinou '+R$(f.valor)+' para '+esc(f.destino)+'.'}
        <button class="mini-btn" style="margin-top:9px" onclick="desfazerFechamento('${k}')">Desfazer</button></div>`
    : (sobra>0 ? `<div style="border-top:1px solid var(--linha);margin-top:13px;padding-top:13px">
        <div class="rot" style="margin-bottom:9px">O que fazer com essa sobra</div>
        ${(D.poupancas||[]).map(pp=>`<button class="mini-btn" style="width:100%;margin-bottom:7px;text-align:left;padding:11px 13px"
          onclick="guardarSobra('${k}',${pp.id})">Guardar em ${esc(pp.nome)} <span style="color:var(--cinza);font-weight:400">· hoje ${R$(pp.saldo)}</span></button>`).join('')}
        ${(D.dividas||[]).filter(d=>!(d.parcela>0)&&(d.saldoAvulso||0)>0).map(d=>`<button class="mini-btn" style="width:100%;margin-bottom:7px;text-align:left;padding:11px 13px"
          onclick="abaterComSobra('${k}',${d.id})">Abater ${esc(d.nome)} <span style="color:var(--cinza);font-weight:400">· falta ${R$(d.saldoAvulso)}</span></button>`).join('')}
        <button class="mini-btn fantasma" style="width:100%;padding:11px 13px" onclick="deixarEmConta('${k}')">Deixar em conta</button>
        <button class="mini-btn fantasma" style="width:100%;padding:11px 13px;margin-top:7px" onclick="registrarSalario('${k}')">Corrigir o valor recebido</button>
      </div>`
      : `<div class="aviso rs" style="margin:13px 0 0">O mês fechou no vermelho. Vale olhar o acerto e ver de onde veio.
         <button class="mini-btn" style="margin-top:9px" onclick="deixarEmConta('${k}')">Entendi, anotar</button></div>`)}
  </div>`;

function registrarSalario(k){
  const atual=salarioRecebido(k);
  const v=prompt('Quanto caiu na conta?', (atual!==null?atual:rendaBase()).toFixed(2));
  const n=parseFloat(String(v).replace(',','.'));
  if(!(n>0))return;
  D.fechamentos=D.fechamentos||{};
  const f=D.fechamentos[k]||{};
  f.salario=n; f.recebidoEm=hojeISO();
  D.fechamentos[k]=f;
  salvar();render();
  const s=sobraDoMes(k);
  toast(s>=0?'Sobraram '+R$(s):'Faltaram '+R$(Math.abs(s)));
}
function guardarSobra(k,id){
  const p=D.poupancas.find(x=>x.id===id), s=sobraDoMes(k);
  const v=prompt('Quanto guardar em '+p.nome+'?', s.toFixed(2));
  const n=parseFloat(String(v).replace(',','.'));
  if(!(n>0))return;
  p.saldo+=n;
  D.fechamentos[k]=Object.assign(D.fechamentos[k]||{},{destino:p.nome,valor:n,em:hojeISO()});
  salvar();render();toast('Guardado '+R$(n)+' em '+p.nome);
}
function abaterComSobra(k,id){
  const d=D.dividas.find(x=>x.id===id), s=Math.min(sobraDoMes(k),d.saldoAvulso||0);
  const v=prompt('Quanto abater de '+d.nome+'?', s.toFixed(2));
  const n=parseFloat(String(v).replace(',','.'));
  if(!(n>0))return;
  d.abatimentos=d.abatimentos||[];
  d.abatimentos.push({data:hojeISO(),valor:n});
  d.saldoAvulso=Math.max((d.saldoAvulso||0)-n,0);
  D.fechamentos[k]=Object.assign(D.fechamentos[k]||{},{destino:d.nome,valor:n,em:hojeISO()});
  salvar();render();toast('Abatido '+R$(n)+' · restam '+R$(d.saldoAvulso));
}
function deixarEmConta(k){
  D.fechamentos=D.fechamentos||{};
  D.fechamentos[k]=Object.assign(D.fechamentos[k]||{},{destino:'conta',valor:sobraDoMes(k),em:hojeISO()});
  salvar();render();toast('Anotado');
}
function desfazerFechamento(k){
  const f=(D.fechamentos||{})[k];
  if(!f||!f.destino)return;
  if(!confirm('Desfazer a destinação? Se você tinha guardado, o valor volta de onde saiu.'))return;
  if(f.destino!=='conta'){
    const p=(D.poupancas||[]).find(x=>x.nome===f.destino);
    if(p)p.saldo=Math.max(p.saldo-f.valor,0);
    const d=(D.dividas||[]).find(x=>x.nome===f.destino);
    if(d){ d.saldoAvulso=(d.saldoAvulso||0)+f.valor;
      d.abatimentos=(d.abatimentos||[]).filter(x=>!(x.valor===f.valor&&x.data===f.em)); }
  }
  delete f.destino; delete f.valor; delete f.em;
  salvar();render();toast('Desfeito · o salário registrado continua');
}

  return `

function grafSobras(){
  const kA=cicloAtual(),ks=[];
  for(let i=11;i>=0;i--){const k=somaMes(kA,-i); if(mesFechado(k)&&!antesDoInicio(k))ks.push(k);}
  if(!ks.length)return '<div class="vazio" style="padding:40px 20px">Nenhum mês fechou ainda. O acerto aparece aqui quando o primeiro fechar.</div>';
  const comSal=ks.filter(k=>salarioRecebido(k)!==null);
  const sob=ks.map(sobraDoMes);
  const total=comSal.reduce((s,k)=>s+sobraDoMes(k),0), media=comSal.length?total/comSal.length:0;
  const mx=Math.max.apply(null,sob.map(Math.abs).concat([1]));
  const guardado=ks.filter(k=>{const f=fechamentoDe(k);return f&&f.destino!=='conta';})
                   .reduce((s,k)=>s+fechamentoDe(k).valor,0);
  return `<div class="saldo">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:10px">
      <div><span class="rot">Sobrou em ${comSal.length} ${comSal.length===1?'mês fechado':'meses fechados'}</span>
        <b class="val" style="color:${total>=0?'var(--verde)':'var(--rosa)'}">${R$(Math.abs(total))}</b></div>
      <div style="text-align:right"><span class="rot">média por mês</span>
        <b class="val" style="font-size:17px;color:var(--cinza)">${R$(media)}</b></div></div>
    <div class="fluxo" style="border-top:1px solid var(--linha);padding-top:12px;margin-top:14px">
      <div><div class="rt"><em class="pt" style="background:var(--ouro)"></em>Foi para poupança</div><div class="vl">${R$(guardado)}</div></div>
      <div style="text-align:right"><div class="rt" style="justify-content:flex-end">Ficou em conta</div>
        <div class="vl">${R$(Math.max(total-guardado,0))}</div></div></div>
  </div>
  <div class="secao-titulo">Mês a mês</div>
  <div class="cartao">
    ${ks.map((k,i)=>{const v=sob[i],f=fechamentoDe(k);
      return `<div class="hbar"><div class="l">
        <span>${nomeMes(k)}${f&&f.destino?` <span style="color:var(--cinza);font-size:11px">${f.destino==='conta'?'em conta':'→ '+esc(f.destino)}</span>`:(salarioRecebido(k)===null?' <span style="color:var(--ouro);font-size:11px">falta registrar o salário</span>':'')}</span>
        <b style="color:${v>=0?'var(--verde)':'var(--rosa)'}">${R$(v)}</b></div>
        <div class="t"><i style="width:${(Math.abs(v)/mx)*100}%;background:${v>=0?'var(--verde)':'var(--rosa)'}"></i></div></div>`;}).join('')}
  </div>
  <div class="secao-titulo">Acertos</div>
  ${ks.slice().reverse().map(k=>cartaoFechamento(k)).join('')}`;
}

const totalMetas=()=>(D.poupancas||[]).reduce((s,p)=>s+(p.meta||0),0);
function telaPoupancas(){
  const k=cicloAtual(),guardado=totalGuardado(),metas=totalMetas();
  return `
  <div class="saldo">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:10px">

  </div>

        <div style="text-align:right"><div class="psaldo">${R$(p.saldo)}</div></div></div>
      ${p.meta?`<div class="t"><i style="width:${pc*100}%"></i></div>
        <div class="pmeta"><span>Meta <b>${R$(p.meta)}</b></span>

      <button class="btn ouro" onclick="addPote()">Criar poupança</button></div></div>`
  :`<button class="btn claro" onclick="UI.novoPote=true;render()">+ Nova poupança</button>`}`;
}
function formPote(p){
  return `<div style="border-top:1px solid var(--linha);margin-top:12px;padding-top:12px">
    <div class="campo"><label>Nome</label><input id="epNome" value="${esc(p.nome)}"></div>
    <div class="dupla"><div class="campo"><label>Meta</label><input id="epMeta" type="number" inputmode="decimal" value="${p.meta||''}" placeholder="0,00"></div>
      <div class="campo"><label>Aporte por mês</label><input id="epAporte" type="number" inputmode="decimal" value="${p.aporte||''}"></div></div>
    <div class="campo"><label>Guardar até</label><input id="epAte" type="month" value="${p.ate||''}"></div>
    <div class="dupla"><button class="btn claro" onclick="UI.poteAberto=null;render()">Cancelar</button>
      <button class="btn ouro" onclick="salvarPote(${p.id})">Salvar</button></div>
    <button class="btn claro" style="margin-top:8px;color:var(--rosa)" onclick="apagarPote(${p.id})">Excluir poupança</button></div>`;
}
function editarPote(id){UI.poteAberto=UI.poteAberto===id?null:id;render();}
function salvarPote(id){
  const p=D.poupancas.find(x=>x.id===id);
  p.nome=document.getElementById('epNome').value.trim()||p.nome;
  p.meta=+document.getElementById('epMeta').value||0;
  p.aporte=+document.getElementById('epAporte').value||0;
  p.ate=document.getElementById('epAte').value;
  UI.poteAberto=null;salvar();render();toast('Poupança salva');
}
function apagarPote(id){if(!confirm('Excluir esta poupança?'))return;D.poupancas=D.poupancas.filter(x=>x.id!==id);UI.poteAberto=null;salvar();render();}
function addPote(){
  const n=document.getElementById('npNome').value.trim();
  if(!n)return toast('Dê um nome à poupança');
  D.poupancas.push({id:novoId(),nome:n,meta:+document.getElementById('npMeta').value||0,
    aporte:+document.getElementById('npAporte').value||0,saldo:+document.getElementById('npSaldo').value||0,
    ate:document.getElementById('npAte').value});
  UI.novoPote=false;salvar();render();toast('Poupança criada');
}
function movPote(id,sinal){
  const p=D.poupancas.find(x=>x.id===id);
  const v=prompt((sinal>0?'Quanto guardar em ':'Quanto retirar de ')+p.nome+'?',sinal>0?(p.aporte||''):'');
  const n=parseFloat(String(v).replace(',','.'));
  if(!(n>0))return;
  p.saldo=Math.max(p.saldo+sinal*n,0);salvar();render();toast(sinal>0?'Guardado '+R$(n):'Retirado '+R$(n));
}
function toggleAporte(id){
  const c=id+'-'+cicloAtual(),s=new Set(D.aportesFeitos||[]);
  if(s.has(c))s.delete(c);
  else{s.add(c);const p=D.poupancas.find(x=>x.id===id);if(p&&p.aporte)p.saldo+=p.aporte;}
  D.aportesFeitos=[...s];salvar();render();
}

  ${cartaoConta(k)}
  ${cartaoFatura(k)}

    <div class="fluxo">
      <div><div class="rt"><em class="pt" style="background:var(--verde)"></em>Entrou</div><div class="vl">${R$(ent)}</div></div>

      <div style="text-align:right"><div class="rt" style="justify-content:flex-end"><em class="pt" style="background:var(--rosa)"></em>Saiu</div><div class="vl">${R$(totalMes)}</div></div>
    </div></div>

    const pg=i.n<=(i.d.pagas||0);
    return `<div class="linha-item dv" style="${pg?'opacity:.55':''}">
      <button class="marca ${pg?'on':''}" onclick="pagarDivida(${i.d.id},${i.n})" aria-label="Marcar parcela como paga"></button>
      <div class="corpo"><div class="nome">${esc(i.desc)}</div>
        <div class="sub">${dataBR(i.data)} · ${FORMAS[i.forma]} <span class="tag div">parcela ${i.n}/${i.de}</span>${pg?' <span class="tag ok">paga</span>':''}</div></div>
      <div class="valor">${R$(i.valor)}</div></div>`;
  }
  const parc=i.tipo==='parcela';
  if(parc){
    const pg=i.n<=(i.g.pagas||0);
    return `<div class="linha-item pc">
      <span class="marca on rosa" aria-hidden="true"></span>
      <div class="corpo" onclick="verTipo('parcela')" style="cursor:pointer">
        <div class="nome">${esc(i.desc)}</div>
        <div class="sub">${dataBR(i.data)} · <span class="tag parc">parcela ${i.n}/${i.de}</span> <span class="tag">${esc(i.cat)}</span> <span class="tag fixa">na fatura</span>${pg?' <span class="tag ok">paga</span>':''}</div></div>
      <div class="valor">${R$(i.valor)}</div></div>`;
  }
  return `<div class="linha-item">
    <div class="corpo" onclick="editarGasto(${i.id})" style="cursor:pointer">
      <div class="nome">${esc(i.desc)}</div>
      <div class="sub">${dataBR(i.data)} · ${FORMAS[i.forma]} <span class="tag">à vista</span> <span class="tag">${esc(i.cat)}</span>${ant?' <span class="tag ant">ciclo anterior</span>':''}</div>
    </div>
    <div class="valor">${R$(i.valor)}</div>
    <button class="lapis" onclick="editarGasto(${i.id})" aria-label="Editar">✎</button>
    <button class="x" onclick="apagarGasto(${i.id})" aria-label="Excluir">×</button></div>`;
}
function pagarDivida(id,n){
  const d=D.dividas.find(x=>x.id===id);
  d.pagas = (n<=d.pagas) ? n-1 : n;
  salvar();render();
  toast(n<=d.pagas ? 'Parcela '+n+' paga · faltam '+(d.total-d.pagas)+' · '+R$(faltaDivida(d))
                   : 'Parcela '+n+' desmarcada');
}
function passoControle(pagas,total,fn,id){
  return `<div class="passo">
    <button onclick="${fn}(${id},-1)" ${pagas<=0?'disabled':''} aria-label="Uma parcela a menos">−</button>
    <div class="txt"><b>${pagas} de ${total} pagas</b>${total-pagas?'faltam '+(total-pagas):'quitado'}</div>
    <button class="mais" onclick="${fn}(${id},1)" ${pagas>=total?'disabled':''} aria-label="Uma parcela a mais">+</button>
  </div>`;
}
function passoCompra(id,n){
  const g=D.gastos.find(x=>x.id===id);
  g.pagas=Math.min(Math.max((g.pagas||0)+n,0),g.parcelas);
  salvar();render();
  toast(g.pagas>=g.parcelas?g.desc+' quitada!':g.desc+' · '+g.pagas+'/'+g.parcelas+' pagas');
}
function passoDivida(id,n){
  const d=D.dividas.find(x=>x.id===id);
  d.pagas=Math.min(Math.max((d.pagas||0)+n,0),d.total);
  salvar();render();
  toast(d.pagas>=d.total?d.nome+' quitado!':d.nome+' · faltam '+R$(faltaDivida(d)));
}
function pagarParcela(id,n){
  const g=D.gastos.find(x=>x.id===id);
  const era=g.pagas||0;
  g.pagas = (n<=era) ? n-1 : n;
  salvar();render();
  toast(g.pagas>=n ? 'Parcela '+n+'/'+g.parcelas+' de '+g.desc+' paga · faltam '+(g.parcelas-g.pagas)
                   : 'Parcela '+n+' desmarcada');
}

function cartaoResumo(itens,mes){
  const total=itens.reduce((s,i)=>s+i.valor,0);
  const pf={};itens.forEach(i=>pf[i.forma]=(pf[i.forma]||0)+i.valor);
  const soma=t=>itens.filter(i=>i.tipo===t).reduce((s,i)=>s+i.valor,0);
  return `<div class="cartao">
    <div class="topo">
      <div><span class="rot">Saiu ${mes?'no mês':'no período'}</span><b class="val">${R$(total)}</b></div>
      <div style="text-align:right;cursor:${mes?'pointer':'default'}" ${mes?`onclick="verTipo('cartao')"`:''}>
        <span class="rot">No cartão${mes?' ›':''}</span>
        <b class="val" style="font-size:17px;color:var(--rosa)">${R$(pf.credito||0)}</b></div></div>
    <div class="barra">${Object.keys(FORMAS).map(f=>`<i style="width:${((pf[f]||0)/(total||1))*100}%;background:${COR_FORMA[f]}"></i>`).join('')}</div>
    <div class="legenda">${Object.keys(FORMAS).filter(f=>pf[f]).map(f=>`<div><em style="background:${COR_FORMA[f]}"></em>${FORMAS[f]} <b>${R$(pf[f])}</b></div>`).join('')}</div>
    <div class="reparte">${[['vista','À vista',''],['parcela','Parcelas','var(--rosa)'],
      ['fixa','Fixas','#8A6212'],['divida','Dívidas','var(--tijolo)']].map(q=>
      mes?`<button aria-pressed="${UI.filtroTipo===q[0]}" onclick="verTipo('${q[0]}')">
            <div class="rr">${q[1]}</div><div class="vv" style="${q[2]?'color:'+q[2]:''}">${R$(soma(q[0]))}</div>
            <span class="seta">${UI.filtroTipo===q[0]?'▲':'▼'}</span></button>`
        :`<div><div class="rr">${q[1]}</div><div class="vv" style="${q[2]?'color:'+q[2]:''}">${R$(soma(q[0]))}</div></div>`).join('')}
    </div></div>`;
}
const ROTULO={vista:'Compras à vista',parcela:'Parcelas do mês',fixa:'Assinaturas',divida:'Empréstimos',cartao:'Tudo no cartão',foracartao:'Fora do cartão'};
function verTipo(tp){UI.filtroTipo=UI.filtroTipo===tp?null:tp;UI.editando=null;render();window.scrollTo(0,0);}

function detalheTipo(tp,k){
  const volta=`<button class="voltar" onclick="verTipo('${tp}')">← Voltar ao resumo</button>`;

  if(tp==='cartao'||tp==='foracartao'){
    const noCartao=tp==='cartao';
    const its=itensDoMes(k).filter(i=>noCartao?ehCartao(i):!ehCartao(i));
    const tot=its.reduce((s,i)=>s+i.valor,0);
    const soma=x=>its.filter(i=>i.tipo===x).reduce((s,i)=>s+i.valor,0);
    const cats={};its.forEach(i=>cats[i.cat]=(cats[i.cat]||0)+i.valor);
    const ord=Object.keys(cats).sort((a,b)=>cats[b]-cats[a]);
    const mx=ord.length?cats[ord[0]]:1;
    const pf={};its.forEach(i=>pf[i.forma]=(pf[i.forma]||0)+i.valor);
    const chips=`<div class="chips">
      <button class="chip" aria-pressed="${noCartao}" onclick="UI.filtroTipo='cartao';render()">No cartão</button>
      <button class="chip" aria-pressed="${!noCartao}" onclick="UI.filtroTipo='foracartao';render()">Fora do cartão</button></div>`;
    return volta+chips+`<div class="cartao" style="border-left:3px solid ${noCartao?'var(--rosa)':'var(--tinta2)'}">
      <div class="topo">
        <div><span class="rot">${noCartao?'Fatura de '+nomeMes(k):'Fora do cartão em '+nomeMes(k)}</span>
          <b class="val" style="color:${noCartao?'var(--rosa)':'var(--tinta)'}">${R$(tot)}</b></div>
        <div style="text-align:right"><span class="rot">${noCartao?'Vence':'Lançamentos'}</span>
          <b class="val" style="font-size:16px;color:var(--cinza)">${noCartao?dBR(vencCiclo(k)):its.length}</b></div></div>
      ${noCartao?`<div class="barra">
        <i style="width:${(soma('fixa')/(tot||1))*100}%;background:var(--ouro)"></i>
        <i style="width:${(soma('parcela')/(tot||1))*100}%;background:var(--rosa)"></i>
        <i style="width:${(soma('vista')/(tot||1))*100}%;background:var(--tinta2)"></i></div>
      <div class="legenda">
        <div><em style="background:var(--ouro)"></em>Assinaturas <b>${R$(soma('fixa'))}</b></div>
        <div><em style="background:var(--rosa)"></em>Parcelas <b>${R$(soma('parcela'))}</b></div>
        <div><em style="background:var(--tinta2)"></em>Compras <b>${R$(soma('vista'))}</b></div>
      </div>
      <div style="font-size:11.5px;color:var(--cinza);margin-top:11px;line-height:1.5">
        Compras de ${faixaCiclo(k)} · ${((tot/D.cartao.limite)*100).toFixed(0)}% do limite de ${R$(D.cartao.limite)}<br>
        Das compras livres, ${R$(soma('vista'))} foram decisão sua este mês — o resto já estava contratado.</div>`
      :`<div class="barra">${Object.keys(FORMAS).filter(f=>f!=='credito').map(f=>`<i style="width:${((pf[f]||0)/(tot||1))*100}%;background:${COR_FORMA[f]}"></i>`).join('')}</div>
       <div class="legenda">${Object.keys(FORMAS).filter(f=>f!=='credito'&&pf[f]).map(f=>`<div><em style="background:${COR_FORMA[f]}"></em>${FORMAS[f]} <b>${R$(pf[f])}</b></div>`).join('')}</div>`}
    </div>
    <div class="secao-titulo">Por categoria</div>
    <div class="cartao">${ord.length?ord.map(c=>`<div class="hbar">
      <div class="l"><span>${esc(c)}</span><b>${R$(cats[c])}</b></div>
      <div class="t"><i style="width:${(cats[c]/mx)*100}%;background:${noCartao?'var(--rosa)':'var(--tinta2)'}"></i></div></div>`).join('')
      :'<div class="vazio" style="margin:0">Nada aqui neste mês.</div>'}</div>`;
  }

  if(tp==='vista'){
    const its=itensDoMes(k).filter(i=>i.tipo==='vista');
    const tot=its.reduce((s,i)=>s+i.valor,0);
    const cart=its.filter(ehCartao).reduce((s,i)=>s+i.valor,0);
    const cats={};its.forEach(i=>cats[i.cat]=(cats[i.cat]||0)+i.valor);
    const ord=Object.keys(cats).sort((a,b)=>cats[b]-cats[a]);
    const mx=ord.length?cats[ord[0]]:1;
    return volta+`<div class="cartao">
      <div class="topo">
        <div><span class="rot">Compras à vista em ${nomeMes(k)}</span><b class="val">${R$(tot)}</b></div>
        <div style="text-align:right"><span class="rot">No cartão</span>
          <b class="val" style="font-size:16px;color:var(--rosa)">${R$(cart)}</b></div></div>
      <div style="font-size:11.5px;color:var(--cinza);margin-bottom:12px">${its.length} compras · fora do cartão ${R$(tot-cart)}</div>
      ${ord.map(c=>{const t=+((D.tetosCat||{})[c])||0,v=cats[c],pc=t?v/t:0;
        return `<div class="hbar"><div class="l"><span>${esc(c)}${t?` <span style="color:var(--cinza);font-size:11px">teto ${R$(t)}</span>`:''}</span><b>${R$(v)}</b></div>
        <div class="t"><i style="width:${t?Math.min(pc,1)*100:(v/mx)*100}%;background:${t?corUso(pc):'var(--tinta2)'}"></i></div></div>`;}).join('')}
    </div>`;
  }

  if(tp==='parcela'){
    const abertas=parcelasAbertas(),porCompra={};
    abertas.forEach(x=>{(porCompra[x.g.id]=porCompra[x.g.id]||{g:x.g,ps:[]}).ps.push(x);});
    const noMes=parcelasCartaoMes(k),falta=abertas.reduce((s,x)=>s+x.valor,0);
    return volta+`<div class="cartao">
      <div class="topo">
        <div><span class="rot">Parcelas em ${nomeMes(k)}</span><b class="val" style="color:var(--rosa)">${R$(noMes)}</b></div>
        <div style="text-align:right"><span class="rot">Ainda falta ao todo</span>
          <b class="val" style="font-size:16px;color:var(--cinza)">${R$(falta)}</b></div></div>
      <div style="font-size:11.5px;color:var(--cinza)">${Object.keys(porCompra).length} compra(s) parcelada(s) em aberto · ${abertas.length} parcelas restantes</div>
    </div>`
    + Object.values(porCompra).map(o=>{
        const g=o.g,fl=o.ps.reduce((s,x)=>s+x.valor,0),pg=g.pagas||0,pc=pg/g.parcelas;
        const prox=o.ps[0],ult=o.ps[o.ps.length-1];
        return `<div class="dvcard" style="border-left-color:var(--rosa)">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
            <div style="min-width:0"><div class="dnome">${esc(g.desc)}</div>
              <div class="dsub">${R$(g.valor/g.parcelas)} × ${g.parcelas} · total ${R$(g.valor)} · ${esc(g.cat)}</div></div>
            <div style="text-align:right;flex:none"><div class="dsub">falta</div><div class="dfalta">${R$(fl)}</div></div></div>
          <div class="t"><i style="width:${pc*100}%;background:var(--verde)"></i><i style="width:${(1-pc)*100}%;background:rgba(180,86,106,.35)"></i></div>
          <div class="rodape"><span>faltam <b>${o.ps.length}</b> parcelas</span>
            <span>até <b>${rotuloCurto(ult.k)}</b></span></div>
          ${passoControle(pg,g.parcelas,'passoCompra',g.id)}
          <div style="border-top:1px solid var(--linha);margin-top:11px;padding-top:10px">
            ${o.ps.map(x=>`<div style="display:flex;justify-content:space-between;font-size:12px;color:${x.k===k?'var(--tinta)':'var(--cinza)'};padding:3px 0;${x.k===k?'font-weight:600':''}">
              <span>${x.n}/${x.de} · ${nomeMes(x.k)}${x.k===k?' — este mês':''}</span>
              <span style="font-variant-numeric:tabular-nums">${R$(x.valor)}</span></div>`).join('')}</div>
        </div>`;}).join('');
  }

  if(tp==='fixa'){
    const its=itensDoMes(k).filter(i=>i.tipo==='fixa');
    const tot=its.reduce((s,i)=>s+i.valor,0);
    return volta+`<div class="cartao">
      <div class="topo">
        <div><span class="rot">Assinaturas em ${nomeMes(k)}</span><b class="val" style="color:#8A6212">${R$(tot)}</b></div>
        <div style="text-align:right"><span class="rot">Por ano</span>
          <b class="val" style="font-size:16px;color:var(--cinza)">${R$(tot*12)}</b></div></div>
      <div style="font-size:11.5px;color:var(--cinza);margin-bottom:12px">${its.length} assinaturas · ${((tot/rendaBase())*100).toFixed(1)}% do salário</div>
      <div class="aviso" style="margin-bottom:14px">Todas já entram na fatura desde o primeiro dia do mês, mesmo as que ainda vão cair. O número que você vê já conta com elas.</div>
      ${its.slice().sort((a,b)=>b.valor-a.valor).map(i=>`<div class="hbar">
        <div class="l"><span>${esc(i.desc)} <span style="color:var(--cinza);font-size:11px">dia ${i.f.dia}</span></span><b>${R$(i.valor)}</b></div>
        <div class="t"><i style="width:${(i.valor/tot)*100}%;background:var(--ouro)"></i></div></div>`).join('')}
      <button class="btn claro" style="margin-top:6px" onclick="UI.filtroTipo=null;UI.filtroGasto='fixas';render()">Editar assinaturas</button>
    </div>`;
  }

  if(tp==='divida'){
    const noMes=itensDoMes(k).filter(i=>i.tipo==='divida').reduce((s,i)=>s+i.valor,0);
    return volta+`<div class="cartao">
      <div class="topo">
        <div><span class="rot">Empréstimos em ${nomeMes(k)}</span><b class="val" style="color:var(--tijolo)">${R$(noMes)}</b></div>
        <div style="text-align:right"><span class="rot">Deve ao todo</span>
          <b class="val" style="font-size:16px;color:var(--cinza)">${R$(totalDevidoEmprestimos())}</b></div></div>
      <div style="font-size:11.5px;color:var(--cinza)">${noMes?((noMes/rendaBase())*100).toFixed(0)+'% do salário sai em empréstimo este mês':'Nenhuma parcela de empréstimo este mês'}</div>
      <div class="aviso tj" style="margin:12px 0 0">Para dar baixa numa parcela, toque na bolinha ao lado dela na lista do mês. O saldo devedor cai na hora.</div>
    </div>`
    + D.dividas.map(d=>{
        const fl=faltaDivida(d),tt=totalDivida(d),pg=tt-fl,pc=tt?pg/tt:0;
        const ult=ultimaParcela(d),semPlano=!(d.parcela>0);
        const nesteMes=parcelasDivida(d).find(x=>x.k===k);
        return `<div class="dvcard">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
            <div style="min-width:0"><div class="dnome">${esc(d.nome)}</div>
              <div class="dsub">${semPlano?'saldo em aberto · use o − para registrar pagamentos':R$(d.parcela)+' × '+d.total+' · vence dia '+d.dia}</div>
              ${nesteMes?`<div style="margin-top:7px"><span class="pill">parcela ${nesteMes.n}/${nesteMes.de} neste mês</span></div>`
                :(d.inicio&&d.inicio>k?`<div style="margin-top:7px"><span class="pill aviso">começa em ${rotuloCurto(d.inicio)}</span></div>`:'')}</div>
            <div style="text-align:right;flex:none"><div class="dsub">falta</div><div class="dfalta">${R$(fl)}</div></div></div>
          ${semPlano?`<div style="border-top:1px solid var(--linha);margin-top:11px;padding-top:10px">
            ${(d.abatimentos||[]).length?(d.abatimentos||[]).map(x=>`<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--cinza);padding:3px 0">
              <span>pago em ${dataBR(x.data)}</span><span style="font-variant-numeric:tabular-nums">−${R$(x.valor)}</span></div>`).join('')
              :'<div style="font-size:12px;color:var(--cinza)">Nenhum pagamento registrado ainda.</div>'}
            <button class="mini-btn" style="margin-top:9px" onclick="abaterDivida(${d.id})">Registrar pagamento</button></div>`
          :`<div class="t"><i style="width:${pc*100}%;background:var(--verde)"></i><i style="width:${(1-pc)*100}%;background:rgba(155,92,46,.35)"></i></div>
          <div class="rodape"><span>Pagas <b>${d.pagas}</b> de ${d.total} · faltam <b>${d.total-d.pagas}</b></span>
            <span>${ult?'acaba em <b>'+rotuloCurto(ult)+'</b>':''}</span></div>`}
        </div>`;}).join('');
  }
  return '';
}

function camposGasto(g,p){
  const v=g||{desc:'',valor:'',data:hojeISO(),cat:D.catsGasto[0],forma:'credito',parcelado:false,parcelas:2};
  return `
    <div class="campo"><label>Descrição</label><input id="${p}Desc" value="${esc(v.desc)}" placeholder="No que gastou"></div>
    <div class="dupla">
      <div class="campo"><label>Valor total</label><input id="${p}Valor" type="number" inputmode="decimal" value="${v.valor}" placeholder="0,00"></div>
      <div class="campo"><label>Data</label><input id="${p}Data" type="date" value="${v.data}"></div></div>
    <div class="dupla">
      <div class="campo"><label>Categoria</label><select id="${p}Cat">${D.catsGasto.map(c=>`<option ${c===v.cat?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
      <div class="campo"><label>Pagamento</label><select id="${p}Forma">${Object.keys(FORMAS).map(f=>`<option value="${f}" ${f===v.forma?'selected':''}>${FORMAS[f]}</option>`).join('')}</select></div></div>
    <div class="dupla">
      <div class="campo"><label>Forma</label><select id="${p}Parc" onchange="document.getElementById('${p}N').disabled=this.value==='vista'">
        <option value="vista" ${!v.parcelado?'selected':''}>À vista</option>
        <option value="parc" ${v.parcelado?'selected':''}>Parcelado</option></select></div>
      <div class="campo"><label>Nº de parcelas</label><input id="${p}N" type="number" min="2" max="60" value="${v.parcelas||2}" ${!v.parcelado?'disabled':''}></div></div>`;
}
function lerCamposGasto(p){
  const desc=document.getElementById(p+'Desc').value.trim();
  const valor=parseFloat(document.getElementById(p+'Valor').value);
  if(!desc){toast('Descreva o gasto');return null;}
  if(!(valor>0)){toast('Informe o valor');return null;}
  const parcelado=document.getElementById(p+'Parc').value==='parc';
  return{desc,valor,data:document.getElementById(p+'Data').value||hojeISO(),
    cat:document.getElementById(p+'Cat').value,forma:document.getElementById(p+'Forma').value,
    parcelado,parcelas:parcelado?Math.max(+document.getElementById(p+'N').value||2,2):0,pagas:0};
}
function abrirNovoGasto(){
  document.getElementById('painelGasto').innerHTML=`
    <h2>Lançar gasto</h2>
    <div style="font-size:12px;color:var(--cinza);margin-bottom:16px">
      Cai automaticamente na fatura de ${nomeMes(cicloISO(hojeISO()))}, que fecha em ${dBR(fimCiclo(cicloISO(hojeISO())))}.</div>
    ${camposGasto(null,'n')}
    <div class="dupla" style="margin-top:4px">
      <button class="btn claro" onclick="fecharNovoGasto()">Cancelar</button>
      <button class="btn" onclick="addGasto()">Lançar</button></div>`;
  document.getElementById('modalGasto').classList.add('on');
  setTimeout(()=>{const c=document.getElementById('nValor'); if(c)c.focus();},120);
}
function fecharNovoGasto(){ document.getElementById('modalGasto').classList.remove('on'); }
function formEdicao(g){return `<div class="form edicao"><div class="edit-tit">Editando</div>${camposGasto(g,'e')}
  <div class="dupla"><button class="btn claro" onclick="UI.editando=null;render()">Cancelar</button>
  <button class="btn" onclick="salvarEdicao(${g.id})">Salvar</button></div></div>`;}
function addGasto(){
  const d=lerCamposGasto('n');if(!d)return;
  D.gastos.push(Object.assign({id:novoId()},d));
  fecharNovoGasto();salvar();render();

}

          <div class="campo"><label>Fonte</label><select id="gFonte">${D.fontes.map(f=>`<option>${esc(f)}</option>`).join('')}</select></div>
          <div class="campo"><label>Frequência</label><select id="gRep"><option value="unico">Uma vez</option><option value="rep">Todo mês</option></select></div></div>
        <button class="btn verde" onclick="addGanho()">Lançar recebimento</button></div>`
    + `<div class="secao-titulo">Entrou este mês</div>`
    + (itens.length?itens.map(i=>`<div class="linha-item">
        <div class="corpo"><div class="nome">${esc(i.g.desc)}</div>
        <div class="sub">${dataBR(i.g.data)} · <span class="tag rec">${esc(i.g.fonte)}</span>${i.g.repete?' · todo mês':''}</div></div>
        <div class="valor ent">${R$(i.valor)}</div>
        <button class="x" onclick="apagarGanho(${i.g.id})">×</button></div>`).join('')
      :'<div class="vazio">Nenhum recebimento este mês.</div>');
}
function addGanho(){
  const desc=document.getElementById('gDesc').value.trim();
  const valor=parseFloat(document.getElementById('gValor').value);
  if(!desc)return toast('Descreva o recebimento');
  if(!(valor>0))return toast('Informe o valor');
  D.ganhos.push({id:novoId(),desc,valor,data:document.getElementById('gData').value||hojeISO(),
    fonte:document.getElementById('gFonte').value,repete:document.getElementById('gRep').value==='rep',vezes:36});
  salvar();render();toast('Recebimento lançado');
}
function apagarGanho(id){if(!confirm('Excluir este recebimento?'))return;D.ganhos=D.ganhos.filter(g=>g.id!==id);salvar();render();}

/* ==================== GRÁFICO ==================== */
function telaGrafico(){
  return `<div class="chips">
    <button class="chip tj" aria-pressed="${UI.vistaGraf==='dividas'}" onclick="UI.vistaGraf='dividas';render()">Dívidas</button>
    <button class="chip" aria-pressed="${UI.vistaGraf==='mes'}" onclick="UI.vistaGraf='mes';render()">Por mês</button>
    <button class="chip" aria-pressed="${UI.vistaGraf==='ano'}" onclick="UI.vistaGraf='ano';render()">Por ano</button>
    <button class="chip tj" aria-pressed="${UI.vistaGraf==='divano'}" onclick="UI.vistaGraf='divano';render()">Dívidas no ano</button>
    <button class="chip" aria-pressed="${UI.vistaGraf==='sobras'}" onclick="UI.vistaGraf='sobras';render()">Sobras</button>
  </div>` + (UI.vistaGraf==='sobras'?grafSobras():UI.vistaGraf==='dividas'?grafDividas():UI.vistaGraf==='divano'?grafDividasAno():UI.vistaGraf==='ano'?grafAno():grafMes());
}
function grafMes(){
  const kA=cicloAtual(),chaves=[];
  for(let i=5;i>=0;i--){const k=somaMes(kA,-i); if(!antesDoInicio(k))chaves.push(k);}
  const ents=chaves.map(entradasMes),sais=chaves.map(fluxoMes);
  const maxV=Math.max.apply(null,ents.concat(sais).concat([1]));
  const W=340,bw=13,esp=4,grupo=bw*2+esp,gap=(W-6*grupo)/7;
  const barras=chaves.map((k,i)=>{
    const x=gap+i*(grupo+gap),at=k===kA;
    const he=Math.max((ents[i]/maxV)*100,2),hs=Math.max((sais[i]/maxV)*100,2);
    return `<rect x="${x}" y="${118-he}" width="${bw}" height="${he}" rx="3" fill="#2E7D52"></rect>
      <rect x="${x+bw+esp}" y="${118-hs}" width="${bw}" height="${hs}" rx="3" fill="#B4566A"></rect>
      <text x="${x+grupo/2}" y="134" text-anchor="middle" font-size="10.5" font-family="Inter" font-weight="${at?600:400}" fill="${at?'#12322A':'#6E7C74'}">${M3[+k.slice(5)-1]}</text>`;
  }).join('');
  const itens=itensDoMes(kA),tot=itens.reduce((s,i)=>s+i.valor,0)||1;
  const porForma={};itens.forEach(i=>porForma[i.forma]=(porForma[i.forma]||0)+i.valor);
  const C=2*Math.PI*44;let off=0;
  const aneis=Object.keys(FORMAS).map(f=>{
    const len=((porForma[f]||0)/tot)*C;
    const el=`<circle cx="60" cy="60" r="44" fill="none" stroke="${COR_FORMA[f]}" stroke-width="15" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"></circle>`;
    off+=len;return el;}).join('');
  const gastosCat=porCatVariavel(kA),tetos=D.tetosCat||{};
  const cats=Object.keys(gastosCat).sort((a,b)=>gastosCat[b]-gastosCat[a]);
  const maxC=cats.length?gastosCat[cats[0]]:1;
  return `
  <div class="secao-titulo">Entrou × saiu — últimos 6 meses</div>
  <div class="cartao">
    <svg viewBox="0 0 ${W} 145" width="100%" role="img" aria-label="Entradas e saídas dos últimos seis meses">${barras}</svg>
    <div class="fluxo" style="border-top:1px solid var(--linha);padding-top:11px">
      <div><div class="rt"><em class="pt" style="background:var(--verde)"></em>Entrou este mês</div><div class="vl">${R$(entradasMes(kA))}</div></div>
      <div style="text-align:right"><div class="rt" style="justify-content:flex-end"><em class="pt" style="background:var(--rosa)"></em>Saiu</div><div class="vl">${R$(fluxoMes(kA))}</div></div>
    </div></div>
  <div class="secao-titulo">Como você pagou este mês</div>
  <div class="cartao" style="display:flex;gap:14px;align-items:center">
    <svg viewBox="0 0 120 120" width="118" height="118" style="flex:none">${aneis}
      <text x="60" y="56" text-anchor="middle" font-size="9" font-family="Inter" fill="#6E7C74" letter-spacing="1">TOTAL</text>
      <text x="60" y="72" text-anchor="middle" font-size="14" font-family="Fraunces" fill="#12322A">${curto(tot===1?0:tot)}</text></svg>
    <div style="flex:1">${Object.keys(FORMAS).map(f=>`<div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:7px">
      <span style="color:var(--cinza)"><em style="display:inline-block;width:8px;height:8px;border-radius:99px;background:${COR_FORMA[f]};margin-right:6px"></em>${FORMAS[f]}</span>
      <b style="font-variant-numeric:tabular-nums">${(((porForma[f]||0)/tot)*100).toFixed(0)}%</b></div>`).join('')}</div></div>
  <div class="secao-titulo">Gastos variáveis × teto por categoria</div>
  <div class="cartao">${cats.length?cats.map(c=>{
      const g=gastosCat[c],t=+tetos[c]||0,pc=t?g/t:0;
      return `<div class="hbar"><div class="l"><span>${esc(c)}${t?` <span style="color:var(--cinza);font-size:11px">teto ${R$(t)}</span>`:''}</span><b>${R$(g)}</b></div>
        <div class="t"><i style="width:${t?Math.min(pc,1)*100:(g/maxC)*100}%;background:${t?corUso(pc):'var(--tinta2)'}"></i></div></div>`;}).join('')
    :'<div class="vazio" style="margin:0">Sem gastos variáveis este mês.</div>'}</div>`;
}
function grafAno(){
  const a=UI.anoRef,meses=mesesDoAno(a);
  const ents=meses.map(entradasMes),sais=meses.map(fluxoMes);
  const totE=ents.reduce((s,v)=>s+v,0),totS=sais.reduce((s,v)=>s+v,0),saldo=totE-totS;
  const maxV=Math.max.apply(null,ents.concat(sais).concat([1]));
  const W=340,bw=9,esp=3,grupo=bw*2+esp,gap=(W-12*grupo)/13;
  const barras=meses.map((k,i)=>{
    const x=gap+i*(grupo+gap);
    const he=Math.max((ents[i]/maxV)*98,1.5),hs=Math.max((sais[i]/maxV)*98,1.5);
    return `<rect x="${x}" y="${112-he}" width="${bw}" height="${he}" rx="2.5" fill="#2E7D52"></rect>
      <rect x="${x+bw+esp}" y="${112-hs}" width="${bw}" height="${hs}" rx="2.5" fill="#B4566A"></rect>
      <text x="${x+grupo/2}" y="128" text-anchor="middle" font-size="8.5" font-family="Inter" fill="#6E7C74">${M3[i][0].toUpperCase()}</text>`;}).join('');
  const cg=agregaAno(a,itensDoMes,'cat');
  const ordG=Object.keys(cg.tot).map(c=>[c,cg.tot[c]]).sort((x,y)=>y[1]-x[1]);
  const maxG=ordG.length?ordG[0][1]:1;
  return `
  <div class="navmes"><button onclick="UI.anoRef--;render()">‹</button>
    <div class="cen"><b>${a}</b><span>meses fecham no dia ${D.cartao.fechamento}</span></div>
    <button onclick="UI.anoRef++;render()">›</button></div>
  <div class="saldo">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:10px">
      <div><span class="rot">${saldo>=0?'Sobrou em':'Faltou em'} ${a}</span>
        <b class="val" style="color:${saldo>=0?'var(--verde)':'var(--rosa)'}">${R$(Math.abs(saldo))}</b></div></div>
    <svg viewBox="0 0 ${W} 138" width="100%" style="margin-top:10px" role="img" aria-label="Entradas e saídas mês a mês">${barras}</svg>
    <div class="fluxo" style="border-top:1px solid var(--linha);padding-top:11px">
      <div><div class="rt"><em class="pt" style="background:var(--verde)"></em>Entrou no ano</div><div class="vl">${R$(totE)}</div></div>
      <div style="text-align:right"><div class="rt" style="justify-content:flex-end"><em class="pt" style="background:var(--rosa)"></em>Saiu</div><div class="vl">${R$(totS)}</div></div>
    </div></div>
  <div class="secao-titulo">Gastos por categoria no ano</div>
  <div class="cartao">${ordG.length?ordG.map(x=>`
    <details class="catbox"><summary>
      <div class="catlin"><span class="nm"><span class="sta">›</span>${esc(x[0])}</span>
      <b>${R$(x[1])}<span class="pc">${totS?((x[1]/totS)*100).toFixed(0):0}%</span></b></div>
      <div class="hbar" style="margin:0"><div class="t"><i style="width:${(x[1]/maxG)*100}%;background:var(--rosa)"></i></div></div></summary>
    <div class="mensal">${cg.mensal[x[0]].map((mv,mi)=>mv>0?`
      <div class="mlin"><span class="mn">${M3[mi]}</span>
      <span class="mt"><i style="width:${(mv/Math.max.apply(null,cg.mensal[x[0]]))*100}%"></i></span>
      <span class="mv">${R$(mv)}</span></div>`:'').join('')}</div></details>`).join('')
    :'<div class="vazio" style="margin:0">Sem gastos neste ano.</div>'}</div>`;
}

/* ==================== AJUSTES ==================== */
function abrirAjustes(){
  document.getElementById('painelAjustes').innerHTML=`
    <h2>Ajustes</h2>
    <div class="sinc" id="seloAjustes"></div>
    <div class="secao-titulo">Renda e teto</div>
    <div class="cartao">
      <div class="campo"><label>Renda esperada por mês</label><input id="aRenda" type="number" inputmode="decimal" value="${D.renda||''}"></div>
      <div class="campo"><label>Contribuição do parceiro</label><input id="aParc" type="number" inputmode="decimal" value="${D.contribParceiro||''}" placeholder="deixe vazio se não entra"></div>
      <div class="campo"><label>Controle começa em</label>
        <input id="aInicio" type="month" value="${D.inicioUso||''}"></div>
      <div style="font-size:11.5px;color:var(--cinza);margin-bottom:12px;line-height:1.5">
        Nada antes desse mês é contado nem exibido. O passado fica para trás.</div>
      <div class="campo"><label>Quero que sobre no fim do mês</label>
        <input id="aSobra" type="number" inputmode="decimal" value="${D.sobraDesejada||''}" placeholder="deixe vazio para não reservar nada"></div>
      <div style="font-size:11.5px;color:var(--cinza);margin-bottom:12px;line-height:1.5">
        Esse valor sai da conta antes de tudo. É o que garante que você não termine o mês apertada.</div>
      <button class="btn" onclick="salvarAjustes()">Salvar</button></div>
    <div class="secao-titulo">Cartão e ciclo</div>
    <div class="cartao">
      <div class="campo"><label>Nome</label><input id="aCartaoNome" value="${esc(D.cartao.nome)}"></div>
      <div class="dupla">
        <div class="campo"><label>Fecha dia</label><input id="aFech" type="number" min="1" max="31" value="${D.cartao.fechamento}"></div>
        <div class="campo"><label>Vence dia</label><input id="aVenc" type="number" min="1" max="31" value="${D.cartao.vencimento}"></div></div>
      <div class="campo"><label>Limite</label><input id="aLimite" type="number" inputmode="decimal" value="${D.cartao.limite}"></div>
      <div style="font-size:11.5px;color:var(--cinza);margin-bottom:12px;line-height:1.5">
        O mês de agosto vai de <b>${faixaCiclo(cicloAtual())}</b> e vence em <b>${dBR(vencCiclo(cicloAtual()))}</b>.</div>
      <button class="btn claro" onclick="salvarCartao()">Salvar cartão</button></div>
    <div class="secao-titulo">Categorias de gasto</div>
    <div class="cartao">
      <div class="cats-chips">${D.catsGasto.map((c,i)=>`<span class="cat-chip">${esc(c)}<button onclick="apagarCatGasto(${i})">×</button></span>`).join('')}</div>
      <div class="campo" style="margin-top:12px"><label>Nova categoria</label><input id="novaCatGasto" placeholder="Ex.: Pet, Farmácia"></div>
      <button class="btn claro" onclick="addCatGasto()">Criar categoria</button></div>
    <div class="secao-titulo">O aplicativo</div>
    <div class="cartao">
      <div style="font-size:13px;margin-bottom:12px">Versão <b>${VERSAO}</b></div>
      <button class="btn claro" onclick="procurarAtualizacao()">Procurar atualização</button>
      <button class="btn claro" style="margin-top:8px" onclick="baixarCopia()">Baixar cópia dos meus dados</button>
      <input type="file" id="arqCopia" accept=".json,application/json" style="display:none" onchange="restaurarCopia(this)">
      <button class="btn claro" style="margin-top:8px" onclick="document.getElementById('arqCopia').click()">Restaurar de um arquivo</button>
    </div>
    <button class="btn claro" style="margin-top:12px" onclick="fecharAjustes()">Fechar</button>`;
  document.getElementById('modalAjustes').classList.add('on');
  marcar(estadoSinc);
}
function fecharAjustes(){document.getElementById('modalAjustes').classList.remove('on');}
function salvarAjustes(){
  D.renda=+document.getElementById('aRenda').value||0;
  D.contribParceiro=+document.getElementById('aParc').value||0;
  D.sobraDesejada=+document.getElementById('aSobra').value||0;
  D.inicioUso=document.getElementById('aInicio').value||'';
  if(UI.mesRef<D.inicioUso)UI.mesRef=cicloAtual();
  salvar();render();fecharAjustes();toast('Ajustes salvos');
}
function salvarCartao(){
  D.cartao.nome=document.getElementById('aCartaoNome').value.trim()||D.cartao.nome;
  D.cartao.fechamento=Math.min(Math.max(+document.getElementById('aFech').value||1,1),28);
  D.cartao.vencimento=+document.getElementById('aVenc').value||1;
  D.cartao.limite=+document.getElementById('aLimite').value||0;
  UI.mesRef=cicloAtual();salvar();render();fecharAjustes();toast('Cartão salvo');
}
function addCatGasto(){
  const n=document.getElementById('novaCatGasto').value.trim();
  if(!n)return toast('Dê um nome à categoria');
  if(D.catsGasto.some(c=>c.toLowerCase()===n.toLowerCase()))return toast('Essa categoria já existe');
  D.catsGasto.push(n);salvar();abrirAjustes();toast('Categoria criada');
}
function apagarCatGasto(i){
  if(D.catsGasto.length<=1)return toast('Deixe ao menos uma categoria');
  D.catsGasto.splice(i,1);salvar();abrirAjustes();
}

function baixarCopia(){
  try{
    const b=new Blob([JSON.stringify(D,null,1)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b);
    a.download='minhas-financas-'+hojeISO()+'.json';
    a.click();
    toast('Cópia baixada');
  }catch(e){ toast('Não consegui gerar a cópia'); }
}
function restaurarCopia(input){
  const f=input.files&&input.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const v=JSON.parse(r.result);
      if(!v||!v.gastos)return toast('Arquivo não reconhecido');
      if(!confirm('Isto substitui tudo que está no app pelos dados do arquivo. Continuar?'))return;
      D=normalizar(v); salvar(); render(); fecharAjustes(); toast('Dados restaurados');
    }catch(e){ toast('Arquivo inválido'); }
  };
  r.readAsText(f);
  input.value='';
}

/* ==================== INFRA ==================== */
let timerToast=null;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('on');
  clearTimeout(timerToast);timerToast=setTimeout(()=>el.classList.remove('on'),2200);
}
const ABAS=[['inicio','Início',telaInicio],['gastos','Gastos',telaGastos],
            ['ganhos','Ganhos',telaGanhos],['grafico','Gráfico',telaGrafico],
            ['poupancas','Poupanças',telaPoupancas]];
function render(){
  const aba=ABAS.find(a=>a[0]===UI.aba)||ABAS[0];
  document.getElementById('tela').innerHTML=aba[2]();
  document.getElementById('nav').innerHTML=
    ABAS.slice(0,4).map(a=>`<button class="${a[0]==='ganhos'?'gan':''}" aria-current="${a[0]===UI.aba}" onclick="ir('${a[0]}')">${a[1]}</button>`).join('')
    +'<div class="divisor"></div>'
    +`<button class="pou" aria-current="${UI.aba==='poupancas'}" onclick="ir('poupancas')">Poupanças</button>`;
  const fab=document.getElementById('fab');
  if(fab)fab.className=(UI.aba==='inicio'||UI.aba==='gastos')?'on':'';
  const pou=UI.aba==='poupancas';
  document.getElementById('eyebrow').textContent=pou?'Poupanças':'Financeiro';
  document.getElementById('titulo').textContent=pou?'O que estou guardando':'Minhas finanças';
  const num=document.getElementById('hNum'),txt=document.getElementById('hTxt');
  const k=cicloAtual();
  if(pou){num.textContent=R$(totalGuardado());txt.textContent='guardados em '+D.poupancas.length+' poupanças';}
  else{
    const lv=livre(k);
    num.textContent=R$(Math.abs(lv));
    txt.textContent=(lv>=0?'posso gastar até ':'acima do plano — fecha ')+dBR(fimCiclo(k));
  }
}
function fecharTudo(){fecharNovoGasto();}
function ir(a){UI.aba=a;UI.editando=null;UI.filtroTipo=null;UI.fixaAberta=null;UI.novaFixa=false;UI.poteAberto=null;UI.novoPote=false;UI.divAberta=null;UI.novaDiv=false;render();window.scrollTo(0,0);}
/* boot */
const salvo=lerLocal();
if(salvo && salvo.gastos) D=normalizar(salvo);
UI.mesRef=cicloAtual();
UI.anoRef=agora().getFullYear();
document.getElementById('verNum').textContent=VERSAO;
render();
carregarFirebase();
setTimeout(()=>procurarAtualizacao(true),4000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ UI.mesRef=cicloAtual(); render(); procurarAtualizacao(true);} });
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
